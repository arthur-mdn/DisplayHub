# Standalone Mongo WITHOUT auth, same project volume as prod.
# Do NOT merge with docker-compose.prod.yml.
#
# Usage:
#   docker compose -f docker-compose.prod.yml down
#   docker compose -f docker-compose.prod.mongo-bootstrap.yml up -d
#   set -a && source .env && set +a
#   ./scripts/bootstrap-existing-mongo-auth.sh
#   docker compose -f docker-compose.prod.mongo-bootstrap.yml down
#   docker compose -f docker-compose.prod.yml up -d
#
# If the volume name differs, list it with: docker volume ls | grep -i mongo

services:
  DisplayHub-mongodb:
    image: mongo:8
    container_name: displayhub-mongodb
    restart: "no"
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - DisplayHub_mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  DisplayHub_mongodb_data:
    driver: local
