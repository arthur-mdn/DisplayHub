services:
  DisplayHub-mongodb:
    image: mongo:8
    container_name: displayhub-mongodb
    restart: unless-stopped
    command: ["mongod", "--config", "/etc/mongo/mongod.conf"]
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27019}:27017"
    volumes:
      - DisplayHub_mongodb_data:/data/db
      - ./mongo/mongod.conf:/etc/mongo/mongod.conf:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  DisplayHub-server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: displayhub-server
    image: displayhub-server-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      COOKIE_SECURE: "false"
      DB_URI: mongodb://DisplayHub-mongodb:27017/DisplayHub
    volumes:
      - ./server:/app
      - ./server/uploads:/app/uploads
      - ./server/public:/app/public
      - /app/node_modules
    ports:
      - "127.0.0.1:${VITE_SERVER_PORT}:${VITE_SERVER_PORT}"
    depends_on:
      DisplayHub-mongodb:
        condition: service_healthy

  DisplayHub-client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: displayhub-client
    image: displayhub-client-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${VITE_CLIENT_PORT}:${VITE_CLIENT_PORT}"
    depends_on:
      - DisplayHub-server

  DisplayHub-admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: displayhub-admin
    image: displayhub-admin-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - ./admin:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${VITE_ADMIN_PORT}:${VITE_ADMIN_PORT}"
    depends_on:
      - DisplayHub-server

  DisplayHub-vitrine:
    build:
      context: ./vitrine
      dockerfile: Dockerfile.dev
    container_name: displayhub-vitrine
    image: displayhub-vitrine-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - ./vitrine:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:${VITE_VITRINE_PORT}:3000"
    depends_on:
      - DisplayHub-server

volumes:
  DisplayHub_mongodb_data:
    driver: local
